spring.application.name=user-service

# Database - uses env vars in Kubernetes, falls back to localhost for local dev
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:users_db}
spring.datasource.username=${DB_USER:triageadmin}
spring.datasource.password=${DB_PASSWORD:localdevpass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.port=8081

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

jwt.secret=${JWT_SECRET:this-is-a-temporary-local-dev-secret-change-this-later}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}