spring.application.name=ticket-service
server.port=8082
app.messaging.mode=${MESSAGING_MODE:log}
aws.region=${AWS_REGION:ap-south-1}
aws.sqs.queue-url=${SQS_QUEUE_URL:}
# Shared JWT secret — must match User Service
jwt.secret=${JWT_SECRET:this-is-a-temporary-local-dev-secret-change-this-later}

# Shared key used by Triage Service for internal requests
internal.api-key=${INTERNAL_API_KEY:local-dev-internal-key}

# Disable Spring Boot's unused default generated user
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.datasource.url=jdbc:postgresql://localhost:5432/ticket_db
spring.datasource.username=triageadmin
spring.datasource.password=localdevpass
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.data-source-properties.options=-c TimeZone=UTC

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
management.endpoints.web.exposure.include=health



